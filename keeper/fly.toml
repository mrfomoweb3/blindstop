# fly launch --no-deploy --copy-config -c keeper/fly.toml   (from the repo root)
# fly secrets set -c keeper/fly.toml KEEPER_PRIVATE_KEY=… OUTLAYER_PAYMENT_KEY=…
app = "blindstop-keeper"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NEAR_NETWORK = "testnet"
  BLINDSTOP_CONTRACT = "blindstop.testnet"
  KEEPER_ACCOUNT = "blindstop-keeper.testnet"
  OUTLAYER_PROJECT = "blindstop-watch.testnet/blindstop-watcher"
  TICK_INTERVAL_MS = "3000"
  HEARTBEAT_EVERY = "5"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
