[package]
name = "blindstop-room"
description = "Blindstop's OutLayer component (wasm32-wasip2): binds blindstop-core to OutLayer storage, keys and HTTP."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

# Its own workspace: this crate only builds for wasm32-wasip2.
[workspace]

[[bin]]
name = "blindstop-room"
path = "src/main.rs"

[dependencies]
blindstop-core = { path = "../core" }
outlayer = { version = "0.2.1", features = ["signing-keys", "encryption-keys"] }
wasi-http-client = "0.2.1"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
