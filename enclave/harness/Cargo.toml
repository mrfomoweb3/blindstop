[package]
name = "blindstop-harness"
description = "Runs the real Blindstop OutLayer wasm locally under wasmtime against recorded Hyperliquid fixtures, a fake NEAR RPC pair and a fake /exchange."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "blindstop-harness"
path = "src/main.rs"

[dependencies]
blindstop-core = { path = "../core" }
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
sha2.workspace = true
borsh.workspace = true
ed25519-dalek.workspace = true
k256.workspace = true
hmac = "0.12"
chacha20poly1305 = "0.10"
anyhow = "1"
wasmtime = { version = "36.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "async"] }
wasmtime-wasi = "36.0.3"
wasmtime-wasi-http = "36.0.3"
hyper = "1"
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
