[workspace]
resolver = "2"
members = ["enclave/core", "enclave/harness"]
# Built separately:
#   contracts/blindstop  wasm32-unknown-unknown via cargo-near
#   enclave/room         wasm32-wasip2 (the OutLayer component)
exclude = ["contracts/blindstop", "enclave/room"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/mrfomoweb3/blindstop"

[workspace.dependencies]
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
hkdf = "0.12"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
